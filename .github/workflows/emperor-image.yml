# Образ traefik с JA4 для стенда emperor (см. emperor/Dockerfile).
# Только на ветках emperor/*: upstream-воркфлоу этого форка не трогаем.
#
# При переносе патча на новый тег traefik: ветка emperor/<тег>-ja4 и
# TRAEFIK_VERSION ниже. Тег образа — ghcr.io/mixailo/traefik:IMAGE_TAG.
#
# IMAGE_TAG поднимать на КАЖДУЮ правку патча (<тег>-ja4.N): тег, на котором
# стоит прод, не должен перезаписываться — иначе пересоздание контейнера
# молча подменит бинарь, а откат на прошлый тег станет невозможен.
# История: v3.6.6-ja4 — JA4 в access-логе (emperor-njff); v3.6.6-ja4.2 —
# плюс заголовок X-Ja4 для правил роутеров (emperor-51tf); v3.6.6-ja4.3 —
# плюс общий пул энкодеров compress и окно br/zstd 1 МиБ (emperor-g4e4);
# v3.7.16-ja4 — те же патчи на v3.7.16 (ветка emperor/v3.7.16-ja4).
name: emperor-image
on:
  push:
    branches: ['emperor/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TRAEFIK_VERSION: v3.7.16
  IMAGE_TAG: v3.7.16-ja4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # Пакеты, которые трогают наши патчи (JA4, пулы compress).
      - run: go test ./pkg/tls/ ./pkg/server/ ./pkg/server/router/tcp/ ./pkg/middlewares/accesslog/ ./pkg/middlewares/compress/

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: emperor/Dockerfile
          build-args: |
            TRAEFIK_VERSION=${{ env.TRAEFIK_VERSION }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
          push: true
          tags: |
            ghcr.io/mixailo/traefik:${{ env.IMAGE_TAG }}
            ghcr.io/mixailo/traefik:${{ env.IMAGE_TAG }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mixailo/traefik
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
